<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria Zdjęć 🖼️</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- NAWIGACJA -->
    <nav>
      <div class="nav-container">
        <div class="logo">🖼️ Galeria</div>
        <div class="nav-search">
          <input
            type="text"
            id="searchInput"
            placeholder="Szukaj zdjęć..."
            autocomplete="off"
          />
          <button id="searchBtn">Szukaj</button>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <header class="hero">
      <h1>Odkryj piękno świata</h1>
      <p>Tysiące darmowych zdjęć wysokiej jakości</p>
    </header>

    <main class="container">
      <!-- FILTRY KATEGORII -->
      <div class="filters" id="filters">
        <!-- Wypełniane przez JS -->
      </div>

      <!-- INFO O WYNIKACH -->
      <div class="results-bar" id="resultsBar">
        <span id="resultsInfo"></span>
        <span id="currentQuery" class="current-query"></span>
      </div>

      <!-- SIATKA ZDJĘĆ -->
      <div class="gallery-grid" id="galleryGrid">
        <!-- Wypełniane przez JS -->
      </div>

      <!-- STANY -->
      <div id="loadingState" class="state-box hidden">
        <div class="spinner"></div>
        <p>Ładowanie zdjęć...</p>
      </div>

      <div id="emptyState" class="state-box hidden">
        <div class="state-icon">🔍</div>
        <h3>Brak wyników</h3>
        <p>Spróbuj innych słów kluczowych</p>
      </div>

      <div id="errorState" class="state-box hidden">
        <div class="state-icon">⚠️</div>
        <h3 id="errorTitle">Coś poszło nie tak</h3>
        <p id="errorMsg"></p>
        <button id="retryBtn" class="btn btn-primary">Spróbuj ponownie</button>
      </div>

      <!-- PRZYCISK ZAŁADUJ WIĘCEJ -->
      <div class="load-more-wrapper" id="loadMoreWrapper" style="display: none">
        <button id="loadMoreBtn" class="btn btn-outline">
          Załaduj więcej zdjęć
        </button>
      </div>
    </main>

    <!-- MODAL -->
    <div id="modal" class="modal hidden">
      <div class="modal-overlay" id="modalOverlay"></div>
      <div class="modal-container">
        <button class="modal-close" id="modalClose">✕</button>
        <button class="modal-nav modal-prev" id="modalPrev">‹</button>
        <button class="modal-nav modal-next" id="modalNext">›</button>

        <div class="modal-content">
          <div class="modal-img-wrapper">
            <img id="modalImg" src="" alt="" />
            <div id="modalLoader" class="modal-img-loader">
              <div class="spinner"></div>
            </div>
          </div>
          <div class="modal-info">
            <div class="modal-photographer">
              <span id="modalPhotographer"></span>
            </div>
            <div class="modal-actions">
              <a
                id="modalDownload"
                href=""
                download
                target="_blank"
                class="btn btn-primary"
              >
                ⬇️ Pobierz
              </a>
              <a
                id="modalPexels"
                href=""
                target="_blank"
                class="btn btn-outline"
              >
                🔗 Pexels
              </a>
            </div>
            <p class="modal-counter" id="modalCounter"></p>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>
        Zdjęcia dostarczone przez
        <a href="https://www.pexels.com" target="_blank">Pexels</a>
      </p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
